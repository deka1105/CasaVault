<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'SFMono-Regular'; src: local('SF Mono'), local('SFMono-Regular'); }
      @font-face { font-family: 'Cascadia Code'; src: local('Cascadia Code'); }
      @font-face { font-family: 'Segoe UI Mono'; src: local('Segoe UI Mono'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: #f6f4ef;
      }
      .wrap {
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center; flex-direction: column;
      }
      .hook-line {
        font-family: Georgia, "Times New Roman", ui-serif, serif;
        font-size: 64px; font-weight: 700; color: #1b1a17;
        line-height: 1.3; text-align: center; opacity: 0;
      }
      .hook-line.stat { font-size: 72px; }
      .hook-line.kicker {
        font-size: 48px; color: #6b6961; margin-top: 24px; font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="wrap" data-composition-id="scene1" data-start="0" data-duration="3.5" data-width="1920" data-height="1080">
      <div id="line1" class="clip hook-line stat" data-start="0.3" data-duration="2.9">87% of landlords have a lawyer.</div>
      <div id="line2" class="clip hook-line stat" data-start="1.1" data-duration="2.1">16% of tenants do.</div>
      <div id="line3" class="clip hook-line kicker" data-start="2.1" data-duration="1.1">They don't lose because they're wrong.</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // beat-locked: 1.60s strong cue
      tl.fromTo("#line1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5 }, 0.3);
      tl.fromTo("#line2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5 }, 1.1);
      tl.fromTo("#line3", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 2.1);
      window.__timelines["scene1"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
