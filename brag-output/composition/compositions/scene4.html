<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'SFMono-Regular'; src: local('SF Mono'), local('SFMono-Regular'); }
      @font-face { font-family: 'Cascadia Code'; src: local('Cascadia Code'); }
      @font-face { font-family: 'Segoe UI Mono'; src: local('Segoe UI Mono'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: #f6f4ef;
      }
      #root {
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center; flex-direction: column;
      }
      .closer-line {
        font-family: system-ui, -apple-system, ui-sans-serif, sans-serif;
        font-size: 44px; font-weight: 600; color: #1b1a17;
        text-align: center; line-height: 1.5; opacity: 0;
      }
      .closer-wordmark {
        font-family: Georgia, "Times New Roman", ui-serif, serif;
        font-size: 80px; font-weight: 700; color: #1d5c4d;
        margin-top: 48px; letter-spacing: -0.02em; opacity: 0;
      }
      .closer-sub {
        font-family: system-ui, -apple-system, ui-sans-serif, sans-serif;
        font-size: 24px; color: #6b6961;
        margin-top: 12px; letter-spacing: 0.06em;
        text-transform: uppercase; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene4" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div>
        <div id="stmt1" class="clip closer-line" data-start="0.3" data-duration="5.7">Every answer cites a source.</div>
        <div id="stmt2" class="clip closer-line" data-start="1.0" data-duration="5.0">Every refusal routes to a human.</div>
      </div>
      <div id="wordmark" class="clip closer-wordmark" data-start="2.3" data-duration="3.7">CasaVault</div>
      <div id="lexhack" class="clip closer-sub" data-start="3.2" data-duration="2.8">Built at LexHack 2026</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#stmt1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 0.3);
      tl.fromTo("#stmt2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 1.0);
      // beat-locked: 17.91s → scene-local 2.91s → placed at 2.3
      tl.fromTo("#wordmark", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.6 }, 2.3);
      tl.fromTo("#lexhack", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 3.2);
      window.__timelines["scene4"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
