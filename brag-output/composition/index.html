<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'SFMono-Regular'; src: local('SF Mono'), local('SFMono-Regular'); }
      @font-face { font-family: 'Cascadia Code'; src: local('Cascadia Code'); }
      @font-face { font-family: 'Segoe UI Mono'; src: local('Segoe UI Mono'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: #f6f4ef;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1: The Stakes — 0s to 3.5s -->
      <div id="scene-1-stakes" class="clip" data-start="0" data-duration="3.5" data-track-index="0" data-composition-id="scene1" data-composition-src="compositions/scene1.html"></div>

      <!-- Scene 2: Upload + Flags — 3.5s to 9.5s -->
      <div id="scene-2-flags" class="clip" data-start="3.5" data-duration="6" data-track-index="1" data-composition-id="scene2" data-composition-src="compositions/scene2.html"></div>

      <!-- Scene 3: Grounded Agent — 9.5s to 15s -->
      <div id="scene-3-agent" class="clip" data-start="9.5" data-duration="5.5" data-track-index="2" data-composition-id="scene3" data-composition-src="compositions/scene3.html"></div>

      <!-- Scene 4: Closer — 15s to 21s -->
      <div id="scene-4-closer" class="clip" data-start="15" data-duration="6" data-track-index="3" data-composition-id="scene4" data-composition-src="compositions/scene4.html"></div>

      <!-- Audio: Music bed -->
      <audio
        id="bg-music"
        data-start="0"
        data-duration="21"
        data-track-index="10"
        data-volume="0.28"
        src="assets/music/happy-beats-business-moves-vol-11-by-ende-dot-app.mp3"
      ></audio>

      <!-- SFX: card arrivals (absolute times: 3.5 + 1.96, 3.5 + 2.50, 3.5 + 3.01) -->
      <audio id="sfx-card1" data-start="5.46" data-duration="0.69" data-track-index="11" data-volume="0.65" src="assets/sfx/casino/card-place-1.ogg"></audio>
      <audio id="sfx-card2" data-start="6.00" data-duration="0.46" data-track-index="12" data-volume="0.65" src="assets/sfx/casino/card-place-2.ogg"></audio>
      <audio id="sfx-card3" data-start="6.51" data-duration="0.89" data-track-index="13" data-volume="0.65" src="assets/sfx/casino/card-place-3.ogg"></audio>

      <!-- SFX: agent refusal thud (absolute: 9.5 + 4.3 = 13.8) -->
      <audio id="sfx-refusal" data-start="13.8" data-duration="0.19" data-track-index="14" data-volume="0.60" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>

      <!-- SFX: soft transitions -->
      <audio id="sfx-trans1" data-start="3.4" data-duration="0.11" data-track-index="15" data-volume="0.45" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-trans2" data-start="9.4" data-duration="0.19" data-track-index="16" data-volume="0.45" src="assets/sfx/interface/drop_002.ogg"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
