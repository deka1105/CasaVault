<!doctype html><meta charset="utf-8"><title>probe</title><body style="margin:0">
<script>
const errors = [];
window.addEventListener("error", (e) => errors.push("ERR:" + (e.message || "").slice(0, 80)));
window.addEventListener("unhandledrejection", (e) => errors.push("REJ:" + String(e.reason).slice(0, 80)));
const f = document.createElement("iframe");
f.style.cssText = "width:1200px;height:900px;border:0";
f.src = "/";
document.body.appendChild(f);
f.onload = () => setTimeout(() => {
  const w = f.contentWindow, d = f.contentDocument;
  const signIn = d.getElementById("sign-in-btn");
  const authArea = d.getElementById("auth-area");
  document.title = [
    "authAreaVisible=" + (authArea && !authArea.hidden),
    "signInBtnVisible=" + (signIn && !signIn.hidden),
    "window.Clerk=" + typeof w.Clerk,
    "clerk.loaded=" + (w.Clerk ? !!w.Clerk.loaded : "n/a"),
    "uiCtor=" + typeof w.__internal_ClerkUICtor,
    "clerk.user=" + (w.Clerk ? String(w.Clerk.user) : "n/a"),
    "clerk.client=" + (w.Clerk && w.Clerk.client ? "present" : "absent"),
    "errors=[" + errors.join(" | ") + "]",
  ].join(" ;; ");
}, 9000);
</script>
