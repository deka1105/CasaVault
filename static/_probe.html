<!doctype html><meta charset="utf-8"><title>probe</title><body style="margin:0">
<iframe id="f" src="/" style="width:1280px;height:1800px;border:0"></iframe>
<script>
document.getElementById("f").onload = () => setTimeout(() => {
  const d = document.getElementById("f").contentDocument;
  const g = d.querySelector(".home-points"), cs = getComputedStyle(g);
  document.title = `grid w=${Math.round(g.getBoundingClientRect().width)} cols=${cs.gridTemplateColumns}`;
}, 2200);
</script>
