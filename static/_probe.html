<!doctype html><meta charset="utf-8"><title>probe</title><body style="margin:0">
<script>
const f = document.createElement("iframe");
f.style.cssText = "width:320px;height:2600px;border:0";
f.src = "/?vault=1266c61875f14e4891fccab6f489d109";
document.body.appendChild(f);
f.onload = () => setTimeout(() => {
  const d = f.contentDocument, de = d.documentElement, vw = de.clientWidth;
  const out = [];
  d.querySelectorAll("*").forEach((n) => {
    const r = n.getBoundingClientRect();
    if (r.width > 0 && r.right > vw + 1 && !n.closest(".table-wrap")) {
      const h2 = n.querySelector("h2, h1, legend");
      out.push(n.tagName + "." + (n.className || "-") + "#" + (n.id || "-") +
               " [" + (h2 ? h2.textContent.trim().slice(0,22) : (n.textContent||"").trim().slice(0,22)) + "]" +
               " w=" + Math.round(r.width) + " R=" + Math.round(r.right));
    }
  });
  document.title = "vw=" + vw + " scrollW=" + de.scrollWidth + " ;; " + out.join(" ;; ");
}, 2500);
</script>
