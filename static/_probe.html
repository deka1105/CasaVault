<!doctype html><meta charset="utf-8"><title>probe</title>
<body style="margin:0">
<script>
const ID = "1266c61875f14e4891fccab6f489d109";
const widths = [320, 360, 390, 414];
const results = [];
let i = 0;
function next() {
  if (i >= widths.length) { document.title = results.join(" ;; "); return; }
  const w = widths[i++];
  const f = document.createElement("iframe");
  f.style.cssText = "width:" + w + "px;height:2400px;border:0";
  f.src = "/?vault=" + ID;
  document.body.appendChild(f);
  f.onload = () => setTimeout(() => {
    const d = f.contentDocument, de = d.documentElement;
    const vw = de.clientWidth;
    const bad = [];
    d.querySelectorAll("*").forEach((n) => {
      const r = n.getBoundingClientRect();
      if (r.width > 0 && r.right > vw + 1) {
        const wrap = n.closest(".table-wrap");
        if (!wrap) bad.push(n.tagName + "." + (n.className || "-") + "#" + (n.id || "-") + " R=" + Math.round(r.right));
      }
    });
    results.push(w + "px: vw=" + vw + " scrollW=" + de.scrollWidth + (bad.length ? " BAD[" + bad.slice(0,6).join(" / ") + "]" : " CLEAN"));
    f.remove();
    next();
  }, 2200);
}
next();
</script>
