<!doctype html><meta charset="utf-8"><title>probe</title><body style="margin:0">
<iframe id="f" src="/" style="width:1280px;height:1800px;border:0"></iframe>
<script>
document.getElementById("f").onload = () => setTimeout(() => {
  const d = document.getElementById("f").contentDocument;
  const out = [];
  const grab = (sel) => {
    const n = d.querySelector(sel);
    if (!n) return out.push(sel + ": MISSING");
    const r = n.getBoundingClientRect(), cs = getComputedStyle(n);
    out.push(`${sel}: w=${Math.round(r.width)} maxW=${cs.maxWidth} padL=${cs.paddingLeft} cols=${cs.gridTemplateColumns}`);
  };
  ["#landing .home-hero", "#landing .page-wide", ".home-points", ".home-points li"].forEach(grab);
  document.title = out.join(" ;; ");
}, 2200);
</script>
